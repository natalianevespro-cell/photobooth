<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photobooth Vintage</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
    }

    body {
      background-color: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 500px;
      width: 100%;
    }

    .camera-box {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
      border: 4px solid #333;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Espelhamento da câmera */
      filter: grayscale(100%) contrast(120%);
    }

    .countdown-overlay {
      position: absolute;
      font-size: 6rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 20px rgba(0,0,0,0.8);
      display: none;
    }

    button {
      background-color: #fff;
      color: #000;
      border: none;
      padding: 15px 30px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 5px;
      letter-spacing: 1px;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #ddd;
    }

    button:disabled {
      background-color: #555;
      cursor: not-allowed;
    }

    /* Estilo da tirinha para exibição na tela e impressão */
    #strip-container {
      margin-top: 20px;
      display: none;
      flex-direction: column;
      align-items: center;
      background-color: #fff;
      padding: 20px;
      border-radius: 4px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .strip {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #fff;
      padding: 10px;
      width: 240px;
    }

    .strip img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      filter: grayscale(100%) contrast(125%);
    }

    .strip-footer {
      color: #000;
      text-align: center;
      font-size: 0.8rem;
      margin-top: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    canvas {
      display: none;
    }

    /* Configurações específicas para impressão */
    @media print {
      body * {
        visibility: hidden;
      }
      #strip-container, #strip-container * {
        visibility: visible;
      }
      #strip-container {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="camera-box">
      <video id="webcam" autoplay playsinline></video>
      <div id="countdown" class="countdown-overlay">3</div>
    </div>

    <button id="start-btn">TIRAR FOTOS</button>

    <div id="strip-container">
      <div class="strip" id="photo-strip">
        <!-- As fotos capturadas serão inseridas aqui dinamicamente -->
      </div>
      <div class="strip-footer">PHOTOBOOTH • <span id="strip-date"></span></div>
    </div>
  </div>

  <canvas id="canvas"></canvas>
  <audio id="shutter-sound" src="1.mp3" preload="auto"></audio>

          audio: false 
        });
        video.srcObject = stream;
      } catch (err) {
        alert("Erro ao acessar a câmera: " + err.message);
      }
    }

      shutterSound.play().catch(() => {});
    }
