<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobooth - Estilo Filme P&B Analógico</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e2f;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: #2a2a40;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 600px;
            width: 100%;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            color: #ff6b81;
        }

        .viewport-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }

        video, canvas {
            width: 100%;
            height: auto;
            display: block;
            transform: scaleX(-1);
        }

        canvas {
            display: none;
        }

        #countdown-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #a4a4a4;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s ease;
            box-sizing: border-box;
        }

        #countdown-overlay.active {
            opacity: 1;
        }

        .film-target {
            position: relative;
            width: 220px;
            height: 220px;
            border: 6px solid #111;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #b5b5b5;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.4);
        }

        .film-target::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 4px;
            background: #111;
        }

        .film-target::after {
            content: '';
            position: absolute;
            width: 4px;
            height: 100%;
            background: #111;
        }

        .inner-circle {
            position: absolute;
            width: 140px;
            height: 140px;
            border: 4px solid #111;
            border-radius: 50%;
            z-index: 1;
        }

        .countdown-number {
            font-family: 'Courier New', Courier, monospace;
            font-size: 110px;
            font-weight: bold;
            color: #111;
            z-index: 2;
            line-height: 1;
        }

        .actions {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #ff6b81;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background-color: #747d8c;
            cursor: not-allowed;
            transform: none;
        }

        .hidden {
            display: none !important;
        }

        #status-text {
            margin: 15px 0 0 0;
            font-size: 14px;
            color: #a4b0be;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Cabine de Fotos Retrô P&B 🎞️</h2>
        
        <div class="viewport-wrapper">
            <video id="webcam" autoplay playsinline></video>
            <div id="countdown-overlay">
                <div class="film-target">
                    <div class="inner-circle"></div>
                    <span id="countdown-num" class="countdown-number">3</span>
                </div>
            </div>
            <canvas id="hidden-canvas"></canvas>
        </div>

        <canvas id="strip-canvas"></canvas>

        <div class="actions">
            <button id="start-btn">Começar Sequência</button>
            <button id="save-btn" class="hidden" style="background-color: #2ed573;">Salvar / Compartilhar Tirinha</button>
            <button id="retake-btn" class="hidden" style="background-color: #747d8c;">Tirar Outra</button>
        </div>

        <p id="status-text">Clique no botão para iniciar a sequência de 4 fotos.</p>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const hiddenCanvas = document.getElementById('hidden-canvas');
        const stripCanvas = document.getElementById('strip-canvas');
        const startBtn = document.getElementById('start-btn');
        const saveBtn = document.getElementById('save-btn');
        const retakeBtn = document.getElementById('retake-btn');
        const countdownOverlay = document.getElementById('countdown-overlay');
        const countdownNum = document.getElementById('countdown-num');
        const statusText = document.getElementById('status-text');

        let capturedDataUrls = [];
        let audioCtx = null;
        let generatedBlob = null;

        const audioFileUrl = 'kauasilbershlachparodes-shutter-click-3-494029.mp3'; 
        let shutterAudio = new Audio(audioFileUrl);

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playProjectorBeep() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) {
                console.error(e);
            }
        }

        function playCustomShutterSound() {
            try {
                shutterAudio.currentTime = 0; 
                shutterAudio.play().catch(err => {
                    console.log("Erro ao reproduzir áudio personalizado: ", err);
                });
            } catch (e) {
                console.error(e);
            }
        }

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 1280, height: 720 }, 
                    audio: false 
                });
                video.srcObject = stream;
            } catch (err) {
                console.error("Erro ao acessar a câmera: ", err);
                alert("Não foi possível acessar a webcam. Verifique as permissões do seu navegador.");
            }
        }

        initCamera();

        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        startBtn.addEventListener('click', async () => {
            initAudio(); 
            startBtn.disabled = true;
            capturedDataUrls = [];
            stripCanvas.style.display = 'none';
            video.style.display = 'block';
            
            for (let i = 1; i <= 4; i++) {
                statusText.innerText = `Preparando foto ${i} de 4...`;
                
                for (let c = 3; c > 0; c--) {
                    countdownNum.innerText = c;
                    countdownOverlay.classList.add('active');
                    playProjectorBeep(); 
                    await sleep(1000);
                }
                
                countdownNum.innerText = "📸";
                playCustomShutterSound(); 
                await sleep(300);
                countdownOverlay.classList.remove('active');

                const dataUrl = captureFrameWithAnalogBWFilter();
                capturedDataUrls.push(dataUrl);

                if (i < 4) {
                    await sleep(1000);
                }
            }

            statusText.innerText = "Tirinha gerada! Processando download automático...";
            video.style.display = 'none';
            startBtn.classList.add('hidden');
            retakeBtn.classList.remove('hidden');

            generatePhotoStrip();
        });

        function captureFrameWithAnalogBWFilter() {
            const context = hiddenCanvas.getContext('2d');
            hiddenCanvas.width = video.videoWidth;
            hiddenCanvas.height = video.videoHeight;

            context.translate(hiddenCanvas.width, 0);
            context.scale(-1, 1);
            context.drawImage(video, 0, 0, hiddenCanvas.width, hiddenCanvas.height);

            const imgData = context.getImageData(0, 0, hiddenCanvas.width, hiddenCanvas.height);
            const pixels = imgData.data;

            for (let i = 0; i < pixels.length; i += 4) {
                let r = pixels[i];
                let g = pixels[i + 1];
                let b = pixels[i + 2];

                let gray = 0.299 * r + 0.587 * g + 0.114 * b;
                gray = (gray - 128) * 1.4 + 128;
                let noise = (Math.random() - 0.5) * 32;
                gray += noise;
                gray = Math.min(255, Math.max(0, gray));

                pixels[i]     = gray;
                pixels[i + 1] = gray;
                pixels[i + 2] = gray;
            }

            context.putImageData(imgData, 0, 0);
            return hiddenCanvas.toDataURL('image/png');
        }

        function generatePhotoStrip() {
            const ctx = stripCanvas.getContext('2d');
            
            const stripWidth = 560;   
            const stripHeight = 1500; 
            
            stripCanvas.width = stripWidth;
            stripCanvas.height = stripHeight;

            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, stripWidth, stripHeight);

            const borderSize = 10; 
            const availableWidth = stripWidth - (borderSize * 2);
            const availableHeight = stripHeight - (borderSize * 2);
            
            const gap = borderSize; 
            const totalGaps = gap * 3;
            const imgHeight = (availableHeight - totalGaps) / 4; 
            const imgWidth = availableWidth;

            let imagesLoaded = 0;

            capturedDataUrls.forEach((dataUrl, index) => {
                const img = new Image();
                img.onload = () => {
                    const x = borderSize;
                    const y = borderSize + (index * (imgHeight + gap));
                    ctx.drawImage(img, x, y, imgWidth, imgHeight);

                    imagesLoaded++;
                    if (imagesLoaded === capturedDataUrls.length) {
                        stripCanvas.style.display = 'block';
                        
                        // AUTO-DOWNLOAD: Baixa a foto automaticamente para ativar o atalho do iPad
                        const link = document.createElement('a');
                        link.download = 'tirinha-photobooth.png';
                        link.href = stripCanvas.toDataURL('image/png');
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        
                        statusText.innerText = "Tirinha concluída e enviada!";
                    }
                };
                img.src = dataUrl;
            });
        }

        retakeBtn.addEventListener('click', () => {
            stripCanvas.style.display = 'none';
            video.style.display = 'block';
            retakeBtn.classList.add('hidden');
            startBtn.classList.remove('hidden');
            startBtn.disabled = false;
            statusText.innerText = "Clique no botão para iniciar a sequência de 4 fotos.";
        });
    </script>
</body>
</html>
